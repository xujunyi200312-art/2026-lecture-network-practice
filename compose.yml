services:
  # 매주 쓰는 기본 환경
  lab:
    build: .
    volumes:
      - .:/lab
    working_dir: /lab
    stdin_open: true
    tty: true

  # 6주차 전용 - OSPF 라우터 3대
  # docker compose --profile routing up -d
  r1:
    profiles: ["routing"]
    image: quay.io/frrouting/frr:9.1.0
    privileged: true
    volumes:
      - ./w06-routing/topology/r1:/etc/frr
    networks:
      net_a:
        interface_name: eth0
      net_b:
        interface_name: eth1
  r2:
    profiles: ["routing"]
    image: quay.io/frrouting/frr:9.1.0
    privileged: true
    volumes:
      - ./w06-routing/topology/r2:/etc/frr
    networks:
      net_b:
        interface_name: eth0
      net_c:
        interface_name: eth1
  r3:
    profiles: ["routing"]
    image: quay.io/frrouting/frr:9.1.0
    privileged: true
    volumes:
      - ./w06-routing/topology/r3:/etc/frr
    networks:
      net_c:
        interface_name: eth0
      net_a:
        interface_name: eth1

networks:
  net_a:
  net_b:
  net_c:
